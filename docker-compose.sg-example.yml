networks:
  net-william:
  net-chad:
  net-sg-backbone:

services:
  sg-william:
    build: .
    restart: unless-stopped
    networks:
      - net-william
      - net-sg-backbone
    ports:
      - "7777:7777/udp"
      - "8777:8777/tcp"
    # PNET_HOSTS is authoritative for advertised SG hosts on every restart.
    # PNET_USER_ALIAS / PNET_DEVICE_ALIAS / PNET_GRADE / PNET_SG_RANK drive
    # headless first-run setup; ignored once the node is initialized.
    environment:
      - PNET_HOSTS=sg-william,pnet.thehomegarage.com:7777
      - PNET_GRADE=sg
      - PNET_USER_ALIAS=william
      - PNET_DEVICE_ALIAS=sg-william
      - PNET_SG_RANK=1
      # Testing only: auto-approves any app that registers, skipping the UI step.
      - PNET_AUTO_APPROVE_APPS=1
    volumes:
      - /opt/pnet/william:/root/.pnet

  deliverer-william:
    build:
      context: .
      dockerfile: apps/pnet_deliverer/Dockerfile
    restart: unless-stopped
    networks:
      - net-william
    environment:
      - PNET_ADDR=sg-william:7777
    ports:
      - "3000:3000/tcp"
    volumes:
      - /opt/pnet-deliverer/william:/app
    depends_on:
      - sg-william

  sg-chad:
    build: .
    restart: unless-stopped
    networks:
      - net-chad
      - net-sg-backbone
    ports:
      - "7778:7777/udp"
      - "8778:8777/tcp"
    environment:
      - PNET_HOSTS=sg-chad,pnet.thehomegarage.com:7778
      - PNET_GRADE=sg
      - PNET_USER_ALIAS=chad
      - PNET_DEVICE_ALIAS=sg-chad
      - PNET_SG_RANK=1
      - PNET_AUTO_APPROVE_APPS=1
    volumes:
      - /opt/pnet/chad:/root/.pnet

  deliverer-chad:
    build:
      context: .
      dockerfile: apps/pnet_deliverer/Dockerfile
    restart: unless-stopped
    networks:
      - net-chad
    environment:
      - PNET_ADDR=sg-chad:7777
    ports:
      - "3001:3000/tcp"
    volumes:
      - /opt/pnet-deliverer/chad:/app
    depends_on:
      - sg-chad
