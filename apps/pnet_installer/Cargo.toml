[package]
name = "pnet_installer"
version = "0.1.0"
edition = "2021"
description = "pNet installer agent: catalog, desire, status (notify only)"

[lib]
name = "pnet_installer"
path = "src/lib.rs"

[[bin]]
name = "pnet_installer"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
