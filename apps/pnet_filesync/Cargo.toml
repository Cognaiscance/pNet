[package]
name = "pnet_filesync"
version = "0.1.0"
edition = "2021"
description = "Hybrid pNet filesync: local folder replica + portal web UI"

[lib]
name = "pnet_filesync"
path = "src/lib.rs"

[[bin]]
name = "pnet_filesync"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
