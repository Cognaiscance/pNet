[package]
name = "pnet"
version = "0.1.0"
edition = "2024"

[lib]
name = "pnet"
path = "src/lib/mod.rs"

[[bin]]
name = "pnet"
path = "src/main.rs"

# Long-running mutational fuzzer for untrusted wire codecs (§8.2).
# Usage: cargo run --bin pnet_fuzz_wire -- --iters 100000
[[bin]]
name = "pnet_fuzz_wire"
path = "src/bin/pnet_fuzz_wire.rs"

[dependencies]
ctrlc              = { version = "3", features = ["termination"] }
x25519-dalek       = { version = "2", features = ["static_secrets"] }
ed25519-dalek      = "2"
chacha20poly1305   = "0.10"
base64             = "0.22"
serde              = { version = "1", features = ["derive"] }
toml               = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hkdf = "0.12"
getrandom = "0.2"
