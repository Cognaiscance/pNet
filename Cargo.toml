[workspace]
members = [".", "apps/*"]

[package]
name = "pnet"
version = "0.1.0"
edition = "2024"

[dependencies]
ctrlc              = { version = "3", features = ["termination"] }
x25519-dalek       = { version = "2", features = ["static_secrets"] }
ed25519-dalek      = "2"
chacha20poly1305   = "0.10"
base64             = "0.22"
serde              = { version = "1", features = ["derive"] }
toml               = "0.8"
sha2 = "0.10"
hkdf = "0.12"
