networks:
  net-pnet:

services:
  dg:
    build: .
    restart: unless-stopped
    networks:
      - net-pnet
    # No UDP 7777 publish: a DG only *initiates* flows to its SG, so
    # responses come back through the existing NAT binding. Publishing it
    # also collides with the container's outbound src_port=7777 under
    # rootless podman (pasta) and causes outgoing bootstrap packets to be
    # dropped on the host.
    ports:
      - "8777:8777/tcp"
    # Headless first-run setup: when present, on first boot the container
    # joins an existing user using the supplied invitation code. After
    # initialization these vars are ignored. Generate the code from an
    # existing SG via /invitations.
    environment:
      - PNET_GRADE=dg
      - PNET_DEVICE_ALIAS=${PNET_DEVICE_ALIAS:-}
      - PNET_INVITATION_CODE=${PNET_INVITATION_CODE:-}
      # Admin UI is loopback-only by default; required for host port publish.
      - PNET_HTTP_BIND=0.0.0.0
      # Testing only: auto-approves any app that registers, skipping the UI step.
      - PNET_AUTO_APPROVE_APPS=1
      - PNET_APP_API_REMOTE=1
    volumes:
      - ${HOME}/.pnet:/root/.pnet:Z

  deliverer:
    build:
      context: ../pnet_deliverer
    restart: unless-stopped
    networks:
      - net-pnet
    environment:
      - PNET_ADDR=dg:7777
    ports:
      - "3000:3000/tcp"
    depends_on:
      - dg

